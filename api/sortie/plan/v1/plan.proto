syntax = "proto3";

// Package sortie.plan.v1 is the schema of a sortie plan file: what load to
// generate, where to generate it from, and what must hold for the run to pass.
//
// Plans are written as YAML and parsed into these messages, so field names here
// are the field names in a plan file. Constraints are declared inline rather
// than checked in Go, which keeps the rule next to the field it governs.
package sortie.plan.v1;

import "engine/api/client/options.proto";
import "envoy/config/metrics/v3/stats.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// Plan is the root of a plan file.
message Plan {
  option (buf.validate.message).cel = {
    id: "plan.pools.unique_names"
    message: "pool names must be unique"
    expression: "this.pools.map(p, p.name).size() == this.pools.size()"
  };
  option (buf.validate.message).cel = {
    id: "plan.scenarios.unique_names"
    message: "scenario names must be unique"
    expression: "this.scenarios.map(s, s.name).size() == this.scenarios.size()"
  };

  // Schema version. Only "v1" is understood by this binary.
  string version = 1 [(buf.validate.field).cel = {
    id: "plan.version.supported"
    message: "unsupported plan version, want \"v1\""
    expression: "this == 'v1'"
  }];

  // Pools name the Nighthawk backends that scenarios run on.
  repeated Pool pools = 2 [(buf.validate.field).repeated.min_items = 1];

  // Defaults supplies field values inherited by every scenario that does not
  // set them itself. Its name and thresholds are ignored.
  Scenario defaults = 3;

  // Scenarios run in file order.
  repeated Scenario scenarios = 4 [(buf.validate.field).repeated.min_items = 1];

  // Thresholds applied to every scenario, in addition to any the scenario
  // declares itself.
  repeated string thresholds = 5;

  // Live metrics for every scenario that sets no stats block of its own and
  // finds none in defaults. There are three levels, each replacing the one
  // before it wholesale rather than merging with it: this field, then
  // defaults.stats, then the scenario's own stats. So a scenario without a
  // block does not always get this one: defaults.stats, when set, wins.
  Stats stats = 6;
}

// Stats makes a run observable while it is running: the engine flushes the
// counters it keeps in its Envoy stats store, and the samples of its latency
// statistics, to the sinks named here, every flush_interval. The report at the
// end of the run is unaffected.
//
// Metric names are prefixed so a dashboard can tell scenarios apart: the
// effective prefix is `<prefix>.<label>`, where label is the execution's label
// with each `/`-separated segment lowercased and reduced to [a-z0-9_]
// (`smoke` -> `sortie.smoke`; staircase stage 2 of `smoke` ->
// `sortie.smoke.stage_2`). See compile.StatsPrefix. When the execution is
// dispatched to a pool of listed services or one resolved through DNS, each
// backend's sinks get the backend as one more component -- its host,
// sanitized the same way, or host and port when backends share a host -- so
// every engine of the pool emits its own series. A distributor forwards one
// set of options to every target, so there the prefix has no backend
// component and the targets share a series.
message Stats {
  option (buf.validate.message).cel = {
    id: "stats.needs_a_sink"
    message: "stats needs statsd or at least one entry in sinks"
    expression: "has(this.statsd) || this.sinks.size() > 0"
  };

  // How often the engine flushes to its sinks, at least 1ms: the engine runs
  // its flush timer in whole milliseconds, and anything shorter would become
  // a timer of zero that flushes without pause. The engine's default is 5s.
  // Latency samples are delivered as they are recorded, regardless.
  google.protobuf.Duration flush_interval = 1 [
    (buf.validate.field).duration.gte = {nanos: 1000000},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The first component of every metric name. Default "sortie".
  string prefix = 2 [
    (buf.validate.field).cel = {
      id: "stats.prefix.format"
      message: "prefix must be made of [a-zA-Z0-9_.-] and start with a letter, digit or _"
      expression: "this.matches('^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$')"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Envoy's statsd sink (envoy.stat_sinks.statsd), over UDP.
  Statsd statsd = 3;

  // 4 was open_telemetry, drafted and withdrawn before release: Envoy's OTLP
  // sink sends on the thread that flushes, and its gRPC client asserts it is
  // used on the thread that created it. The engine creates sinks on its main
  // thread and flushes them on a flush worker, so the sink aborts on its first
  // flush. To reach an OpenTelemetry collector, point statsd at the
  // collector's statsd receiver.
  reserved 4;
  reserved "open_telemetry";

  // Other Envoy stats sinks, configured as they would be in an Envoy
  // bootstrap's stats_sinks. Passed through as written -- the prefix scheme
  // above does not apply -- wrapped in the engine's
  // nighthawk.envoy_stats_sink_adapter, which is how an Envoy sink is hosted
  // in the engine.
  //
  // Limited to sinks whose configuration is a message of
  // envoy.config.metrics.v3 (DogStatsdSink, StatsdSink, HystrixSink,
  // MetricsServiceConfig): a plan's typed_config is decoded by sortie, which
  // links those types and no extension's. A sink the engine links but whose
  // config lives elsewhere -- graphite_statsd, wasm -- fails when the plan is
  // parsed. envoy.stat_sinks.open_telemetry is refused outright (see the note
  // on field 4), and so is the adapter itself. A StatsdSink or DogStatsdSink
  // here is held to the statsd shortcut's rules: an IP literal and a port, and
  // no tcp_cluster_name.
  repeated envoy.config.metrics.v3.StatsSink sinks = 5;

  // What names the engine in the statsd sink's metric names, the component
  // after the scenario's: `<prefix>.<scenario>.<backend>.cluster...`.
  //
  // "address" (the default) is the engine's host as the pool lists or
  // resolves it, sanitized: `10.0.0.11:8443` is `10_0_0_11`. sortie makes
  // these distinct within a pool. A pool behind a distributor has no such
  // component: its targets are all sent the same options, so they share one
  // series.
  //
  // "name" is the engine's own name, the one nighthawk_service was started
  // with (--backend-name; the chart's engine.backendNameFrom). An address
  // that changes with every install -- a pod IP -- starts a new set of series
  // each time; a name such as the node's does not. sortie writes a placeholder
  // where the name goes and each engine puts its own in, so this works behind
  // a distributor too, and its targets then have a series each. Two things
  // follow from sortie not knowing the names: an engine started without one
  // refuses the execution, and nothing checks that two engines of a pool are
  // named differently -- give each its own, or their series merge.
  //
  // Concerns the statsd block only, like the rest of the prefix scheme.
  string backend = 6 [
    (buf.validate.field).cel = {
      id: "stats.backend.enum"
      message: "backend must be address or name"
      expression: "this in ['address', 'name']"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Statsd is the statsd sink. UDP only: Envoy's TCP statsd sink addresses a
// cluster of the bootstrap, and the engine generates its bootstrap itself.
message Statsd {
  // host:port of the statsd server -- for example an OpenTelemetry collector's
  // statsd receiver.
  string address = 1 [(buf.validate.field).cel = {
    id: "statsd.address.host_port"
    message: "address must be host:port"
    expression: "this.matches('^\\\\[?[^\\\\[\\\\]]+\\\\]?:[0-9]{1,5}$')"
  }];
}

// Pool is a set of Nighthawk backends that a scenario's load is spread over.
//
// Exactly one of services, distributor or dns is set. services addresses
// nighthawk_service instances that sortie drives directly, merging the results
// itself. distributor addresses a nighthawk_distributor that fans the request
// out to targets on sortie's behalf. dns names the services by a host name
// that `run` resolves once, when it starts, so the list follows whatever
// answers for the name -- the pods of a headless Service -- rather than being
// written down.
message Pool {
  option (buf.validate.message).cel = {
    id: "pool.one_dispatch_mode"
    message: "set one of services, distributor or dns, not more than one"
    expression: "(this.services.size() > 0 ? 1 : 0) + (this.distributor != '' ? 1 : 0) + (this.dns != '' ? 1 : 0) <= 1"
  };
  option (buf.validate.message).cel = {
    id: "pool.some_dispatch_mode"
    message: "set one of services, distributor or dns"
    expression: "this.services.size() > 0 || this.distributor != '' || this.dns != ''"
  };
  option (buf.validate.message).cel = {
    id: "pool.distributor_needs_targets"
    message: "distributor requires at least one entry in targets"
    expression: "this.distributor == '' || this.targets.size() > 0"
  };
  option (buf.validate.message).cel = {
    id: "pool.targets_need_distributor"
    message: "targets is only meaningful together with distributor"
    expression: "this.targets.size() == 0 || this.distributor != ''"
  };

  string name = 1 [(buf.validate.field).string.min_len = 1];

  repeated string services = 2 [(buf.validate.field).repeated.items.cel = {
      id: "pool.service.host_port"
      message: "each service must be host:port"
      expression: "this.matches('^\\\\[?[^\\\\[\\\\]]+\\\\]?:[0-9]{1,5}$')"
    }];

  string distributor = 3 [
    (buf.validate.field).cel = {
      id: "pool.distributor.host_port"
      message: "distributor must be host:port"
      expression: "this.matches('^\\\\[?[^\\\\[\\\\]]+\\\\]?:[0-9]{1,5}$')"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Addresses the distributor fans out to. Only meaningful with distributor.
  repeated string targets = 4 [(buf.validate.field).repeated.items.cel = {
      id: "pool.target.host_port"
      message: "each target must be host:port"
      expression: "this.matches('^\\\\[?[^\\\\[\\\\]]+\\\\]?:[0-9]{1,5}$')"
    }];

  // host:port of nighthawk_service instances to find through DNS: `run`
  // resolves the host's A and AAAA records once, when it starts, and drives
  // every address it got at that port, in sorted order, for the whole run. A
  // Kubernetes headless Service answers with one address per ready pod, so a
  // DaemonSet of engines behind one is a pool of one backend per node that
  // needs no editing when nodes come and go. A name that resolves to nothing
  // is an error before any load is generated. validate and compile accept the
  // pool without resolving it.
  string dns = 5 [
    (buf.validate.field).cel = {
      id: "pool.dns.host_port"
      message: "dns must be host:port"
      expression: "this.matches('^\\\\[?[^\\\\[\\\\]]+\\\\]?:[0-9]{1,5}$')"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Tcp is what a scenario can set about raw TCP load. Its own pool size, not
// Scenario.connections: that one is the HTTP pool's circuit-breaker cap, and
// a TCP run wants a small, exact, eagerly opened pool.
message Tcp {
  // Connections per worker. The engine's default is 1.
  optional uint32 connections = 1 [(buf.validate.field).uint32.gte = 1];

  // Unanswered messages a connection may hold before a scheduled send is
  // dropped and counted in benchmark.tcp_deferred. Default 256.
  optional uint32 max_inflight_per_connection = 2 [(buf.validate.field).uint32.gte = 1];

  // Whether the peer echoes every message, which is what gets timed. Default
  // true; false for a sink that answers nothing, where only the writes count
  // -- and for a target that answers something other than the message, byte
  // for byte: with true, the first reply that is not the message closes the
  // connection (benchmark.tcp_echo_mismatch) and nothing on it is timed.
  optional bool expect_echo = 3;

  // How long to wait for outstanding echoes at the end of the run. Default
  // 500ms.
  google.protobuf.Duration drain_duration = 4 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Messages after which a connection is replaced by a new one, so that a run
  // keeps setting connections up (timed in benchmark_tcp.connect_latency).
  // Once a connection has sent this many, its replacement is opened while it
  // goes on sending and takes over when it has connected, so rotating neither
  // drops nor delays a message; the old one is sent nothing more, is given up
  // to the scenario's timeout for its outstanding echoes, and is closed.
  // Counted in benchmark.tcp_connections_rotated. Default 0: a connection is
  // only replaced when it closes.
  optional uint32 max_messages_per_connection = 5;
}

// Udp is what a scenario can set about UDP load.
message Udp {
  // Unanswered datagrams allowed before a scheduled send is dropped and
  // counted in benchmark.udp_deferred. Default 256.
  optional uint32 max_inflight = 1 [(buf.validate.field).uint32.gte = 1];

  // How long a datagram may go unanswered before it is lost. Default 1s.
  google.protobuf.Duration timeout = 2 [
    (buf.validate.field).duration.gt = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// WebSocket is what a scenario can set about WebSocket load. The rate rule is
// bidi-stream's: each backend's share must be a multiple of its concurrency,
// as must `streams`, and every stream is a connection.
message WebSocket {
  // Connections to upgrade per backend. The engine's default is 20.
  optional uint32 streams = 1 [(buf.validate.field).uint32.gte = 1];

  // Unanswered messages a connection may hold before a scheduled send is
  // dropped and counted in benchmark.stream_deferred. Default 256.
  optional uint32 max_inflight_per_stream = 2 [(buf.validate.field).uint32.gte = 1];

  // How long to wait for outstanding echoes after Close is sent at the end of
  // the run. Default 500ms.
  google.protobuf.Duration drain_duration = 3 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Send the message as binary frames rather than text.
  bool binary = 4;
}

// Tls is what a scenario can set about the TLS handshake with its target. The
// files are read by sortie, as paths relative to the plan file, and sent to
// the backends inline, so a backend needs no access to them.
message Tls {
  option (buf.validate.message).cel = {
    id: "tls.client_pair"
    message: "cert_file and key_file go together"
    expression: "(this.cert_file == '') == (this.key_file == '')"
  };

  // PEM bundle of the roots to verify the target's certificate against. Set,
  // the target must present a certificate chaining to one of them; unset,
  // the certificate is not verified.
  string ca_file = 1;

  // PEM client certificate chain and key, presented when the target asks
  // for one (mTLS). Both or neither.
  string cert_file = 2;
  string key_file = 3;
}

// Scenario is one unit of load: a target, an executor that shapes the request
// rate over time, and the client tuning that goes with it.
message Scenario {
  option (buf.validate.message).cel = {
    id: "scenario.one_target_form"
    message: "set either target or targets, not both"
    expression: "!(this.target != '' && this.targets.size() > 0)"
  };

  string name = 1;

  string pool = 2;

  // URI to benchmark: http:// or https:// for HTTP, gRPC and WebSocket;
  // tcp:// or tcps:// (TLS) with an explicit port for raw TCP (see Tcp);
  // udp:// with an explicit port for UDP (see Udp).
  string target = 3 [
    (buf.validate.field).cel = {
      id: "scenario.target.scheme"
      message: "target scheme must be http, https, tcp, tcps or udp"
      expression: "this.startsWith('http://') || this.startsWith('https://') || this.startsWith('tcp://') || this.startsWith('tcps://') || this.startsWith('udp://')"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  string method = 4;

  // Request headers, each written "Name: value".
  repeated string headers = 5 [(buf.validate.field).repeated.items.cel = {
    id: "scenario.header.format"
    message: "each header must be written \"Name: value\""
    expression: "this.matches('^[^:]+:.*$')"
  }];

  // Request body, sent verbatim. Nighthawk sets no Content-Type for it, so
  // supply one in headers.
  string body = 6;

  // http1, http2 or http3. Defaults to http1.
  string protocol = 7 [
    (buf.validate.field).cel = {
      id: "scenario.protocol.known"
      message: "protocol must be http1, http2 or http3"
      expression: "this in ['http1', 'http2', 'http3']"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  Executor executor = 8;

  // Nighthawk's --connections: the per-worker connection circuit-breaker cap,
  // not a target concurrency.
  optional uint32 connections = 9 [(buf.validate.field).uint32.gte = 1];

  // Nighthawk's --concurrency: worker threads per backend, a positive integer
  // or "auto". "auto" cannot be combined with a rate, because the aggregate
  // rate is divided by the worker count and only the backend knows it.
  string concurrency = 10 [
    (buf.validate.field).cel = {
      id: "scenario.concurrency.format"
      message: "concurrency must be a positive integer or \"auto\""
      expression: "this.matches('^([1-9][0-9]*|auto)$')"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  optional uint32 max_pending_requests = 11;

  optional uint32 max_concurrent_streams = 12 [(buf.validate.field).uint32.gte = 1];

  google.protobuf.Duration timeout = 13 [
    (buf.validate.field).duration.gt = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Thresholds applied to this scenario only.
  repeated string thresholds = 14;

  // gRPC load instead of plain HTTP. Implies protocol http2 and method POST;
  // setting either to anything else is an error. The request message is the
  // body (or body_file), sent verbatim as the serialized protobuf message.
  Grpc grpc = 16;

  // WebSocket load: `streams` connections per backend upgraded from HTTP/1.1,
  // the message (body or body_file) sent on them round-robin at the backend's
  // share of the executor's rate, each timed against its echo -- the bidi-stream schedule and
  // accounting, for WebSocket. The target is the upgrade request's URL
  // (http:// or https://, not ws://). Implies protocol http1 and method GET;
  // mutually exclusive with grpc.
  WebSocket websocket = 19;

  // Raw TCP load, for Envoy's tcp_proxy and TLS-terminating listeners: a
  // tcp:// or tcps:// target selects it, this block tunes it. Each worker
  // keeps `connections` connections open and writes the message (body or
  // body_file, as is) on them round-robin -- the plan's rate is the pool's
  // aggregate, divided over backends and workers as for HTTP; only the
  // engine's own requests_per_second is per worker -- and, with expect_echo,
  // times it against its echo,
  // matched in order (benchmark_tcp.message_latency); the message must not be
  // empty then. A connection that closes is opened again after a short
  // backoff (benchmark.tcp_reconnects); the messages that came due meanwhile
  // are benchmark.tcp_unavailable. method, headers, protocol, grpc and websocket are errors with
  // a tcp target.
  Tcp tcp = 20;

  // UDP load, for Envoy's udp_proxy: a udp:// target selects it, this block
  // tunes it. Each worker sends the message (body or body_file) as one
  // datagram per scheduled request -- the plan's rate is the pool's aggregate,
  // divided over backends and workers as for HTTP; only the engine's own
  // requests_per_second is per worker -- prefixed with a sequence number, and
  // times it against its echo, matched
  // by that number (benchmark_udp.message_latency); a datagram unanswered for
  // `timeout` is lost (benchmark.udp_lost). method, headers, protocol, grpc,
  // websocket and tcp are errors with a udp target; a body is required.
  Udp udp = 21;

  // Live metrics for this scenario, replacing the plan's stats wholesale. Its
  // sinks are added to any that a nighthawk_template carries in stats_sinks; its
  // flush_interval replaces the template's.
  Stats stats = 22;

  // Like body, but the bytes of a file, resolved relative to the plan file.
  // For request messages that are not text, such as serialized protobufs.
  // Mutually exclusive with body.
  string body_file = 17;

  // TLS for an https target beyond the defaults. Without it the engine
  // verifies nothing and presents no certificate, which is what makes a
  // self-signed target work out of the box.
  Tls tls = 18;

  // Nighthawk options passed through untouched, for anything this schema does
  // not model: transport sockets, request source plugins, tunnelling,
  // user-defined output plugins.
  //
  // sortie overlays only the fields it owns -- requests_per_second, duration,
  // execution_id, the rate limiter plugin, and whatever the fields above set --
  // so anything else here reaches the backend as written. This mirrors how
  // Nighthawk's own adaptive load controller takes a
  // nighthawk_traffic_template.
  nighthawk.client.CommandLineOptions nighthawk_template = 15;

  // Several targets driven AT ONCE by this scenario, each with a share of
  // rate: what k6 calls one scenario drawing a weighted target per request.
  // Mutually exclusive with target. Each entry becomes its own execution --
  // its own connection pool, rate limiter, counters and latency histograms --
  // and they run concurrently on every backend in the pool, so the backend
  // must allow that many executions at once (nighthawk_service
  // --max-concurrent-executions; the chart sets it). Every other field of the
  // scenario applies to each target alike; a target that needs its own method,
  // headers or body is its own scenario.
  //
  // Each target's rate is rate x weight / (sum of weights), rounded to the
  // nearest integer and at least 1, and then subject to the usual division
  // over backends and workers. The report lists each target's share.
  repeated Target targets = 23;
}

// Target is one entry of Scenario.targets.
message Target {
  // Names the target in reports, thresholds and metric prefixes
  // (`<scenario>/<name>`). Required and unique within the scenario.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // The URI, with the same schemes as Scenario.target.
  string url = 2 [(buf.validate.field).cel = {
    id: "target.url.scheme"
    message: "url scheme must be http, https, tcp, tcps or udp"
    expression: "this.startsWith('http://') || this.startsWith('https://') || this.startsWith('tcp://') || this.startsWith('tcps://') || this.startsWith('udp://')"
  }];

  // Relative share of the scenario's rate. Default 1.
  uint32 weight = 3;
}

// Grpc selects one of the engine's gRPC modes.
message Grpc {
  // "unary": one gRPC call per request, scored by grpc-status (a failed RPC
  // never counts as http_2xx; see benchmark.grpc_error and
  // benchmark.grpc_status.<code>, and the latency_grpc_ok statistic).
  //
  // "bidi-stream": `streams` long-lived bidirectional streams per backend,
  // sending the request message round-robin at the executor's rate and
  // measuring each message against its echo (benchmark_stream.message_latency).
  // The server is expected to echo one message per message, in order. In this
  // mode the rate is divided between backends only: the backend spreads its
  // share over its workers itself, so each backend's share must be a multiple
  // of its concurrency, as must `streams`.
  string mode = 1 [(buf.validate.field).cel = {
    id: "grpc.mode.known"
    message: "grpc.mode must be unary or bidi-stream"
    expression: "this in ['unary', 'bidi-stream']"
  }];

  // bidi-stream only: streams to open per backend. The engine's default is 20.
  optional uint32 streams = 2 [(buf.validate.field).uint32.gte = 1];

  // bidi-stream only: unanswered messages a stream may hold before a scheduled
  // send is dropped and counted in benchmark.stream_deferred. Default 256.
  optional uint32 max_inflight_per_stream = 3 [(buf.validate.field).uint32.gte = 1];

  // bidi-stream only: how long to wait for outstanding echoes after the
  // streams are half-closed at the end of the run. Default 500ms.
  google.protobuf.Duration drain_duration = 4 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Executor shapes the request rate over time.
message Executor {
  option (buf.validate.message).cel = {
    id: "executor.stages_only_for_staircase"
    message: "stages is only valid for the staircase executor"
    expression: "this.type == 'staircase' || this.stages.size() == 0"
  };
  option (buf.validate.message).cel = {
    id: "executor.ramp_time_only_for_ramping_rate"
    message: "ramp_time is only valid for the ramping-rate executor"
    expression: "this.type == 'ramping-rate' || !has(this.ramp_time)"
  };
  option (buf.validate.message).cel = {
    id: "executor.staircase_needs_stages"
    message: "the staircase executor requires at least one stage"
    expression: "this.type != 'staircase' || this.stages.size() > 0"
  };
  option (buf.validate.message).cel = {
    id: "executor.staircase_rate_on_stages"
    message: "set rate and duration on each stage, not on a staircase executor"
    expression: "this.type != 'staircase' || (this.rate == 0u && !has(this.duration))"
  };
  option (buf.validate.message).cel = {
    id: "executor.rate_required"
    message: "rate must be greater than zero"
    expression: "this.type == 'staircase' || this.rate > 0u"
  };
  option (buf.validate.message).cel = {
    id: "executor.duration_required"
    message: "duration is required"
    expression: "this.type == 'staircase' || has(this.duration)"
  };
  option (buf.validate.message).cel = {
    id: "executor.ramping_rate_needs_ramp_time"
    message: "the ramping-rate executor requires a ramp_time"
    expression: "this.type != 'ramping-rate' || has(this.ramp_time)"
  };
  // Nighthawk's linear ramping rate limiter ramps to --rps over ramp_time and
  // then holds, so a ramp that fills the whole run never reaches its plateau.
  option (buf.validate.message).cel = {
    id: "executor.ramp_time_shorter_than_duration"
    message: "ramp_time must be shorter than duration"
    expression: "!has(this.ramp_time) || !has(this.duration) || this.ramp_time < this.duration"
  };

  // constant-rate, ramping-rate or staircase.
  string type = 1 [(buf.validate.field).cel = {
    id: "executor.type.known"
    message: "executor type must be constant-rate, ramping-rate or staircase"
    expression: "this in ['constant-rate', 'ramping-rate', 'staircase']"
  }];

  // Aggregate requests per second the target receives, across every worker
  // thread of every backend in the pool. Nighthawk's own --rps is per worker,
  // so sortie divides this by backends x concurrency. With per_backend it is
  // each backend's rate instead, divided by concurrency alone.
  uint32 rate = 2;

  google.protobuf.Duration duration = 3 [
    (buf.validate.field).duration.gt = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Ramp linearly from zero to rate over this long, then hold rate for the
  // remainder of duration. ramping-rate only.
  google.protobuf.Duration ramp_time = 4 [
    (buf.validate.field).duration.gt = {seconds: 0},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // staircase only.
  repeated Stage stages = 5;

  // Select Nighthawk's open-loop mode, in which the rate limiter never
  // compensates for a client that cannot keep pace and saturation is reported
  // as pool overflow rather than as latency.
  bool open_loop = 6;

  // Make rate (and each stage's rate) the rate of every backend rather than
  // the pool's total, so the load scales with the pool instead of being
  // spread over it. Written for a dns pool of one engine per node: "60 rps
  // per node" stays 60 rps per node however many nodes the name resolves to.
  // The divisibility rule then applies to rate / concurrency alone. On a
  // distributor pool this is what every target receives anyway, since the
  // distributor forwards one request unchanged to each of them.
  bool per_backend = 7;
}

// Stage is one step of a staircase executor.
//
// Each stage is dispatched as its own Nighthawk execution, because Nighthawk
// cannot change the rate of a run already in flight: the UpdateRequest RPC in
// its service proto is declared but unimplemented. Connections are therefore
// re-established at every stage boundary and each stage yields its own result.
message Stage {
  uint32 rate = 1 [(buf.validate.field).uint32.gt = 0];

  google.protobuf.Duration duration = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {seconds: 0}
  ];
}
