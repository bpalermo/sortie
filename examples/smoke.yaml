# A single steady-rate scenario against one Nighthawk instance.
#
#   nighthawk_service --listen 127.0.0.1:8443
#   sortie run examples/smoke.yaml
version: v1

pools:
  - name: local
    services:
      - "127.0.0.1:8443"

defaults:
  pool: local
  target: http://127.0.0.1:8080/
  protocol: http1
  concurrency: "2"
  connections: 10

# Thresholds listed here apply to every scenario.
thresholds:
  - "counter:benchmark.http_5xx == 0"
  - "counter:benchmark.pool_connection_failure == 0"

scenarios:
  - name: smoke
    executor:
      type: constant-rate
      rate: 100
      duration: 30s
    thresholds:
      - "latency_2xx.p95 < 50ms"
      - "latency_2xx.p99 < 200ms"
