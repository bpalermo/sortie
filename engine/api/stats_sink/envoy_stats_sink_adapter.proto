syntax = "proto3";

package nighthawk;

import "envoy/config/metrics/v3/stats.proto";

// Configuration for the Envoy stats sink adapter (plugin name:
// "nighthawk.envoy_stats_sink_adapter"), a Nighthawk stats sink that forwards everything it
// receives to a stats sink implemented as an Envoy extension.
//
// The backend-name placeholder. When the hosted sink is Envoy's statsd or dog_statsd sink
// (envoy.config.metrics.v3.StatsdSink, DogStatsdSink) and its prefix contains the literal
//
//   %BACKEND%
//
// nighthawk_service replaces every occurrence with its own --backend-name, sanitized to
// [a-z0-9_], when the start request arrives. A percent sign cannot occur in a sanitized
// component, so the placeholder is never mistaken for one. A service started without a name
// refuses such a request (INVALID_ARGUMENT) rather than emit the placeholder as a metric name.
// The standalone nighthawk_client does not expand it. This comment is the definition; the
// constants that spell the placeholder (BackendNameToken in
// engine/source/client/backend_name.h, StatsBackendToken in sortie's internal/plan) follow it.
message EnvoyStatsSinkAdapterConfig {
  // The Envoy stats sink to forward to, configured exactly as it would be in the stats_sinks
  // field of an Envoy bootstrap. The extension must be linked into the Nighthawk binary.
  envoy.config.metrics.v3.StatsSink sink = 1;
}
