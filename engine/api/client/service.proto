syntax = "proto3";

package nighthawk.client;

import "google/protobuf/duration.proto";
import "google/rpc/status.proto";
import "validate/validate.proto";

import "engine/api/client/options.proto";
import "engine/api/client/output.proto";

message StartRequest {
  CommandLineOptions options = 1;
  // When set, the service writes an interim ExecutionResponse this often while
  // the execution runs: `progress` set, and `output` a snapshot of the run so
  // far (its live counters and a copy of the latency statistics, in one
  // "global" result whose execution_duration is the time since the workers
  // started). The final response has no `progress`. Unset, nothing is written
  // before the final response, as before.
  google.protobuf.Duration progress_interval = 2;
}

// Marks an interim ExecutionResponse written while the execution runs.
message Progress {
  // Time since the execution's workers started.
  google.protobuf.Duration elapsed = 1;
}

// TODO(oschaaf): Not implemented yet.
message UpdateRequest {
}

// TODO(oschaaf): Not implemented yet.
message CancellationRequest {
}

message ExecutionRequest {
  oneof command_specific_options {
    option (validate.required) = true;
    StartRequest start_request = 1;
    UpdateRequest update_request = 2;
    CancellationRequest cancellation_request = 3;
  }
}

message ExecutionResponse {
  Output output = 1;
  google.rpc.Status error_detail = 7;
  // Opaque identifier for lookup purposes. This will be taken from CommandLineOptions if set,
  // if it is not set there it will be auto-generated. The format used for auto-generated
  // identifiers may change at any time.
  string execution_id = 8;
  // Set on interim responses only; see StartRequest.progress_interval.
  Progress progress = 9;
}

service NighthawkService {
  //  Accepts a stream of ExecutionRequests, which can be used to initiate, update, or cancel a
  //  test. Returns a stream of ExecutionResponse objects which will contain results for all
  //  Nighthawk runs.
  rpc ExecutionStream(stream ExecutionRequest) returns (stream ExecutionResponse) {
  }
}
