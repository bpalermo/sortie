# Values for the template test that renders a durable report: the output
# arguments, the results stream beside it, and the volume they write to, on
# the Job's pod.
report:
  path: /var/run/sortie/report.json
  stream: results.jsonl
  volume:
    persistentVolumeClaim:
      claimName: soak-reports
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
