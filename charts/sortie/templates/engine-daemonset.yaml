{{- if and .Values.engine.enabled (eq (include "sortie.engineKind" .) "DaemonSet") -}}
# One engine per node, so each node's share of a run -- and, behind a mesh,
# each node's proxy -- carries its own load. The Service in front of it is
# headless: a plan finds the pods through DNS (a `dns:` pool) rather than by
# listing them.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "sortie.engineName" . }}
  labels:
    {{- include "sortie.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  selector:
    matchLabels:
      {{- include "sortie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    {{- include "sortie.enginePodTemplate" . | nindent 4 }}
{{- end -}}
