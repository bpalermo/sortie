{{- if or .Values.job.enabled .Values.cronJob.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  # Named by the plan's digest -- see sortie.configMapName.
  name: {{ include "sortie.configMapName" . }}
  labels:
    {{- include "sortie.labels" . | nindent 4 }}
data:
  plan.yaml: |
    {{- .Values.plan | nindent 4 }}
{{- end -}}
