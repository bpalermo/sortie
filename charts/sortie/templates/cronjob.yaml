{{- if .Values.cronJob.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  # 52, not the usual 63: the CronJob controller appends an 11-character
  # `-<timestamp>` suffix when it creates a Job, so the API server rejects a
  # CronJob name longer than 63 - 11.
  name: {{ include "sortie.fullname" . | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "sortie.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronJob.schedule | quote }}
  # Forbid by default: two load tests running at once measure each other.
  concurrencyPolicy: {{ .Values.cronJob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.job.backoffLimit }}
      {{- /* Not `with`: see job.yaml. */}}
      {{- if not (kindIs "invalid" .Values.job.ttlSecondsAfterFinished) }}
      ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
      {{- end }}
      template:
        {{- include "sortie.podSpec" . | nindent 8 }}
{{- end -}}
