# The target the kind test's plan loads: nighthawk_test_server from the engine
# image, behind a Service named `target`. The chart has no such object because a
# load test's target is whatever is being tested; this one exists so the plan
# in values.yaml has something that answers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: target
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    static_resources:
      listeners:
        - address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    codec_type: AUTO
                    stat_prefix: ingress_http
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: service
                          domains: ["*"]
                    http_filters:
                      - name: test-server
                        typed_config:
                          "@type": type.googleapis.com/nighthawk.server.ResponseOptions
                          response_body_size: 10
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          dynamic_stats: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels: { app: target }
  template:
    metadata:
      labels: { app: target }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: target
          image: localhost/sortie/engine:e2e
          imagePullPolicy: Never
          command: ["/usr/local/bin/nighthawk_test_server"]
          args:
            - --config-path
            - /etc/target/envoy.yaml
            - --disable-hot-restart
            - --concurrency
            - "1"
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/target, readOnly: true }
      volumes:
        - name: config
          configMap: { name: target }
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector: { app: target }
  ports:
    - { name: http, port: 8080, targetPort: http }
