name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Push the image and the chart to GHCR.
  packages: write
  # Exchanged with Fulcio for a short-lived signing certificate. Keyless: there
  # is no private key to store or rotate.
  id-token: write

# Keyed by branch, so publications are serialized. The alternative -- keying by
# commit -- lets two pushes to main publish at once, and since the `dev` tag is
# mutable, an older, slower run can finish last and leave it pointing at a stale
# commit.
#
# The cost is that GitHub keeps only one PENDING run per group: when a third
# push arrives while one is running, the queued one is cancelled and that commit
# publishes nothing. Between the two, a skipped intermediate commit is the
# better failure: it is visible as a cancelled run, and the commit that
# superseded it publishes seconds later, whereas a stale `dev` is silent and
# wrong. The newest commit always wins the tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs, not tags. This job holds
# `packages: write` and `id-token: write`, so an action that a retagged or
# compromised release swapped underneath us could push and sign an image with
# this repository's own identity. A tag is mutable; a commit SHA is not. The
# version each SHA corresponds to is in the comment beside it.
jobs:
  publish:
    # workflow_dispatch can target any branch. Without this guard a manual run
    # from a feature branch would publish under the same mutable tags and sign
    # with a certificate the verification identity below accepts, making it
    # indistinguishable from a publication from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Chart.yaml's appVersion comes from `git describe --tags`, which
          # needs the tags and enough history to reach one.
          fetch-depth: 0
          # checkout otherwise leaves GITHUB_TOKEN in .git/config, and this job
          # then runs Bazel, which executes build tooling from the dependency
          # graph while that token holds `packages: write`. Nothing after this
          # step talks to git over the network -- workspace_status.sh only reads
          # the local repository -- so the credential has no reason to persist.
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      # Everything is built before any credential exists on the runner. Bazel
      # executes build tooling from the dependency graph, and a registry
      # credential sitting in ~/.docker/config.json while that runs is readable
      # by all of it. The `bazel run` steps below then only execute what this
      # step already produced.
      - name: Build the image and the chart
        run: bazel build //image:image_push //charts/sortie:sortie.push_registry

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-arch image
        run: bazel run //image:image_push

      # The digest comes from the build rather than from the registry. Resolving
      # it by listing tags would have to follow ghcr's pagination -- it returns
      # 100 tags per page, ascending, so a freshly pushed tag sorts last and is
      # never on the first page -- and re-resolving a tag reintroduces a
      # time-of-check window against a mutable one. Bazel already wrote the
      # digest it pushed.
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          # The digest is not a default output, so cquery does not list it.
          # It sits beside the index manifest, which is, and both come from the
          # same rule -- so derive one path from the other rather than assuming
          # a bazel-bin layout.
          index_file="$(bazel cquery //image:image_index --output=files 2>/dev/null \
            | grep -E '_index\.json$' | head -1)"
          digest_file="${index_file%_index.json}_digest"
          if [ -z "${digest_file}" ] || [ ! -s "${digest_file}" ]; then
            echo "::error::could not find the image index digest produced by the build" >&2
            exit 1
          fi
          digest="$(cat "${digest_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
          esac
          echo "image=ghcr.io/bpalermo/sortie@${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ghcr.io/bpalermo/sortie@${digest}"

      # --recursive signs the index and every child manifest. Without it, anyone
      # pulling the amd64 or arm64 manifest by its own digest gets something
      # unsigned. Signing by digest rather than by tag avoids cosign
      # re-resolving a mutable tag to something other than what was pushed.
      #
      # ghcr does not implement the OCI Referrers API -- verified: it returns
      # 404 MANIFEST_UNKNOWN for a real digest -- so rules_img's own signing
      # support cannot be used, since it attaches signatures only as referrers.
      # cosign's tag scheme (sha256-<digest>.sig) does work there.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
        run: cosign sign --recursive "${{ steps.digest.outputs.image }}"

      - name: Verify the signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.digest.outputs.image }}"

      # The chart carries the image's digest, pinned at package time, so this
      # publishes a chart that can only ever reference the image signed above.
      #
      # docker/login-action above is not enough: rules_helm pins
      # HELM_REGISTRY_CONFIG to a fresh temp directory for every invocation, so
      # Helm reads neither ~/.docker/config.json nor any config a prior
      # `helm registry login` wrote. Its pusher logs in itself, but only when it
      # finds both of these variables -- otherwise it skips the login without
      # failing and the push gets a 401.
      - name: Push the chart
        env:
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bazel run //charts/sortie:sortie.push_registry
