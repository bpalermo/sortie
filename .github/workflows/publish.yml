name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged with Fulcio for a short-lived signing certificate. Keyless: there
  # is no private key to store or rotate.
  id-token: write

# Keyed by branch, so publications are serialized. The alternative -- keying by
# commit -- lets two pushes to main publish at once, and since the `dev` tag is
# mutable, an older, slower run can finish last and leave it pointing at a stale
# commit.
#
# The cost is that GitHub keeps only one PENDING run per group: when a third
# push arrives while one is running, the queued one is cancelled and that commit
# publishes nothing. Between the two, a skipped intermediate commit is the
# better failure: it is visible as a cancelled run, and the commit that
# superseded it publishes seconds later, whereas a stale `dev` is silent and
# wrong. The newest commit always wins the tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# WHERE everything goes is one setting, bazel/registry.bzl. Bazel loads it;
# each job reads it through scripts/registry.sh into its environment
# (SORTIE_IMAGE, ENGINE_IMAGE, IMAGE_REGISTRY_HOST, ...), and
# scripts/check-registry-config.sh fails CI on a registry spelled out here.
#
# Credentials are a Quay robot account, secrets QUAY_USERNAME / QUAY_TOKEN of
# the `release` environment, which only main can use. The robot can write the
# repositories and cannot create them: each one exists already.
#
# Third-party actions are pinned to commit SHAs, not tags. These jobs hold the
# registry credential and `id-token: write`, so an action that a retagged or
# compromised release swapped underneath us could push and sign an image with
# this repository's own identity. A tag is mutable; a commit SHA is not. The
# version each SHA corresponds to is in the comment beside it.
jobs:
  publish:
    # workflow_dispatch can target any branch. Without this guard a manual run
    # from a feature branch would publish under the same mutable tags and sign
    # with a certificate the verification identity below accepts, making it
    # indistinguishable from a publication from main.
    if: github.ref == 'refs/heads/main'
    # After the engine: the chart published here names the engine image tag
    # stamped with this commit, so that tag has to exist before the chart does.
    # The cost is that a failed engine build publishes no sortie image either,
    # which is what releasing the two in sync means.
    needs: [engine-index]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Chart.yaml's appVersion comes from `git describe --tags`, which
          # needs the tags and enough history to reach one.
          fetch-depth: 0
          # checkout otherwise leaves GITHUB_TOKEN in .git/config, and this job
          # then runs Bazel, which executes build tooling from the dependency
          # graph while that token is live. Nothing after this
          # step talks to git over the network -- workspace_status.sh only reads
          # the local repository -- so the credential has no reason to persist.
          persist-credentials: false

      # Re-running an old workflow run checks that old commit out again, so it
      # would republish it and move the mutable `dev` tag backwards onto a
      # superseded commit -- the same stale tag the branch-keyed concurrency
      # above exists to prevent, reached by a different route. Publishing is
      # only ever correct for main's current tip.
      #
      # ls-remote rather than the API: this repository is public, so the check
      # needs no token, and a token is the thing this job is careful about.
      - name: Refuse to publish a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${GITHUB_SHA}: main is now ${tip}" >&2
            exit 1
          fi
          echo "publishing ${GITHUB_SHA}, which is main's tip"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Read the registry setting
        run: scripts/registry.sh >> "${GITHUB_ENV}"

      # Everything is built before any credential exists on the runner. Bazel
      # executes build tooling from the dependency graph, and a registry
      # credential sitting in ~/.docker/config.json while that runs is readable
      # by all of it. The `bazel run` steps below then only execute what this
      # step already produced.
      #
      # cosign is part of that: the release binary the rules_img_signer_cosign
      # bazel_dep pins by sha256 (//bazel/cosign), the same one
      # `bazel run //bazel/cosign` gives a workstation.
      - name: Build the image, the chart and the tools
        run: |
          bazel build //:image_push //charts/sortie:sortie.chart_push \
            //bazel/cosign //bazel/cosign:verify_image

      # One login covers everything below: image_push (rules_img), chart_push
      # (oras) and cosign all read the Docker config this writes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push the multi-arch image
        run: bazel run //:image_push

      # The digest comes from the build rather than from the registry. Resolving
      # it by listing tags would have to follow the registry's pagination -- a
      # freshly pushed tag is not on the first page -- and re-resolving a tag
      # reintroduces a
      # time-of-check window against a mutable one. Bazel already wrote the
      # digest it pushed.
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          # The digest is not a default output, so cquery does not list it.
          # It sits beside the index manifest, which is, and both come from the
          # same rule -- so derive one path from the other rather than assuming
          # a bazel-bin layout.
          index_file="$(bazel cquery //:image_index --output=files 2>/dev/null \
            | grep -E '_index\.json$' | head -1)"
          digest_file="${index_file%_index.json}_digest"
          if [ -z "${digest_file}" ] || [ ! -s "${digest_file}" ]; then
            echo "::error::could not find the image index digest produced by the build" >&2
            exit 1
          fi
          digest="$(cat "${digest_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
          esac
          echo "image=${SORTIE_IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${SORTIE_IMAGE}@${digest}"

      # --recursive signs the index and every child manifest. Without it, anyone
      # pulling the amd64 or arm64 manifest by its own digest gets something
      # unsigned. Signing by digest rather than by tag avoids cosign
      # re-resolving a mutable tag to something other than what was pushed.
      #
      # The registry serves the OCI 1.1 Referrers API, so cosign 3 attaches
      # each signature as a referrer of the manifest it signs and writes no
      # tag. `bazel run` passes the environment through, so the OIDC request
      # variables `id-token: write` provides reach cosign unchanged.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
        run: bazel run //bazel/cosign -- sign --recursive "${{ steps.digest.outputs.image }}"

      # Every digest that was signed, not just the index: `cosign verify` has
      # no --recursive to match `cosign sign --recursive`, so the verifier
      # walks the index's children itself, as the registry lists them.
      #
      # It then asks the registry where each signature landed, rather than
      # asking the binary that just wrote it whether it likes what it wrote --
      # `cosign verify` accepts every layout cosign has written. The setting
      # promises SIGNATURE_LAYOUT (`referrer`): a referrer and no
      # `sha256-<digest>` tag, for the index and every child. A signature in
      # two places fails.
      - name: Verify the signatures and where they are published
        env:
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: bazel run //bazel/cosign:verify_image -- "${{ steps.digest.outputs.image }}"

      # The chart carries the image's digest, pinned at package time, so this
      # publishes a chart that can only ever reference the image signed above.
      # chart_push writes the artifact `helm push` would, with oras, to the
      # repository the setting names; the login above is its credential.
      - name: Push the chart
        run: bazel run //charts/sortie:sortie.chart_push

  # The engine image. An Envoy binary cannot be cross-built, so each
  # architecture is built natively on its own runner, with the compile offloaded
  # to BuildBuddy's matching pool, and its manifest pushed by digest. The job
  # after this one stitches the two manifests into one tagged index and signs
  # it. Nothing here is tagged, so a half-finished release leaves no tag behind.
  engine:
    if: github.ref == 'refs/heads/main'
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            bazel_config: rbe-buildbuddy-amd64
          # A native arm64 driver is required: the hermetic toolchains derive
          # their execution constraints from the host that runs Bazel.
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel_config: rbe-buildbuddy-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: Read the registry setting
        run: scripts/registry.sh >> "${GITHUB_ENV}"

      # The layer and manifest are named explicitly: with outputs kept remote
      # (--remote_download_toplevel), only what the command line names is
      # downloaded, and the push needs those two files on the runner.
      - name: Build the engine image (${{ matrix.arch }})
        run: |
          bazel build \
            --config=engine-release \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }} \
            --build_metadata=ROLE=CI \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }} \
            //engine:image_push_platform //engine:image_manifest //engine:image_layer

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push the ${{ matrix.arch }} manifest by digest
        run: |
          set -euo pipefail
          bazel run \
            --config=engine-release \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }} \
            //engine:image_push_platform 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | tail -1)"
          if [ -z "${digest}" ]; then
            echo "::error::the push printed no digest" >&2
            exit 1
          fi
          mkdir -p digest
          echo "${digest}" > "digest/${{ matrix.arch }}"
          echo "pushed ${ENGINE_IMAGE}@${digest}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-digest-${{ matrix.arch }}
          path: digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # One index from the two manifests, tagged, signed and verified the way the
  # sortie image is above.
  engine-index:
    needs: engine
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      # For the registry setting and the pinned cosign, both of which live in
      # the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-digest-*
          path: digest
          merge-multiple: true

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: Read the registry setting
        run: scripts/registry.sh >> "${GITHUB_ENV}"

      # Before any credential exists on the runner, as in the publish job.
      - name: Build cosign and the verifier
        run: bazel build //bazel/cosign //bazel/cosign:verify_image

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # The same guard as the publish job: re-running an old run would move the
      # mutable engine:dev tag back onto a superseded commit and sign it.
      - name: Refuse to tag a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to tag ${GITHUB_SHA}: main is now ${tip}" >&2
            exit 1
          fi
          echo "tagging ${GITHUB_SHA}, which is main's tip"

      - name: Stitch and tag the index
        id: digest
        run: |
          set -euo pipefail
          image="${ENGINE_IMAGE}"
          amd64="$(cat digest/amd64)"; arm64="$(cat digest/arm64)"
          for d in "${amd64}" "${arm64}"; do
            case "${d}" in sha256:*) ;; *) echo "::error::unexpected digest ${d}" >&2; exit 1 ;; esac
          done
          docker buildx imagetools create \
            -t "${image}:dev" \
            -t "${image}:dev-${GITHUB_SHA}" \
            "${image}@${amd64}" "${image}@${arm64}"
          index="$(docker buildx imagetools inspect "${image}:dev-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          case "${index}" in sha256:*) ;; *) echo "::error::unexpected index digest ${index}" >&2; exit 1 ;; esac
          echo "image=${image}@${index}" >> "${GITHUB_OUTPUT}"
          echo "index ${image}@${index} (amd64 ${amd64}, arm64 ${arm64})"

      - name: Sign the engine image
        env:
          COSIGN_YES: "true"
        run: bazel run //bazel/cosign -- sign --recursive "${{ steps.digest.outputs.image }}"

      # The index, every child, and where each signature landed: see the
      # publish job.
      - name: Verify the signatures and where they are published
        env:
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: bazel run //bazel/cosign:verify_image -- "${{ steps.digest.outputs.image }}"
