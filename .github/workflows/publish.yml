name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Push the image and the chart to GHCR.
  packages: write
  # Exchanged with Fulcio for a short-lived signing certificate. Keyless: there
  # is no private key to store or rotate.
  id-token: write

# Keyed by branch, so publications are serialized. The alternative -- keying by
# commit -- lets two pushes to main publish at once, and since the `dev` tag is
# mutable, an older, slower run can finish last and leave it pointing at a stale
# commit.
#
# The cost is that GitHub keeps only one PENDING run per group: when a third
# push arrives while one is running, the queued one is cancelled and that commit
# publishes nothing. Between the two, a skipped intermediate commit is the
# better failure: it is visible as a cancelled run, and the commit that
# superseded it publishes seconds later, whereas a stale `dev` is silent and
# wrong. The newest commit always wins the tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs, not tags. This job holds
# `packages: write` and `id-token: write`, so an action that a retagged or
# compromised release swapped underneath us could push and sign an image with
# this repository's own identity. A tag is mutable; a commit SHA is not. The
# version each SHA corresponds to is in the comment beside it.
jobs:
  publish:
    # workflow_dispatch can target any branch. Without this guard a manual run
    # from a feature branch would publish under the same mutable tags and sign
    # with a certificate the verification identity below accepts, making it
    # indistinguishable from a publication from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Chart.yaml's appVersion comes from `git describe --tags`, which
          # needs the tags and enough history to reach one.
          fetch-depth: 0
          # checkout otherwise leaves GITHUB_TOKEN in .git/config, and this job
          # then runs Bazel, which executes build tooling from the dependency
          # graph while that token holds `packages: write`. Nothing after this
          # step talks to git over the network -- workspace_status.sh only reads
          # the local repository -- so the credential has no reason to persist.
          persist-credentials: false

      # Re-running an old workflow run checks that old commit out again, so it
      # would republish it and move the mutable `dev` tag backwards onto a
      # superseded commit -- the same stale tag the branch-keyed concurrency
      # above exists to prevent, reached by a different route. Publishing is
      # only ever correct for main's current tip.
      #
      # ls-remote rather than the API: this repository is public, so the check
      # needs no token, and a token is the thing this job is careful about.
      - name: Refuse to publish a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${GITHUB_SHA}: main is now ${tip}" >&2
            exit 1
          fi
          echo "publishing ${GITHUB_SHA}, which is main's tip"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Deliberately no `cosign-release`. Pinning the action already pins the
      # binary: at this SHA the input defaults to v3.0.6, which is also the
      # action's bootstrap version, so cosign is downloaded and checked against
      # a SHA-256 hardcoded in the action itself, and the install exits there.
      # Naming any other version leaves that path for one that fetches a
      # release key over the network and verifies a signature with it. v4 pins
      # that key's digest and fails closed on a mismatch, so it is sound -- but
      # it is more moving parts for no benefit, and the value has to be kept in
      # lockstep with the pin above or it silently stops matching.
      #
      # This comment described v3.7.0's weaker variant of that path
      # (verify-blob --insecure-ignore-tlog against an unpinned key) until
      # after the bump to v4, because the version numbers in it were updated
      # and the mechanism was not. Check the action, not this comment, when
      # changing the pin.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Everything is built before any credential exists on the runner. Bazel
      # executes build tooling from the dependency graph, and a registry
      # credential sitting in ~/.docker/config.json while that runs is readable
      # by all of it. The `bazel run` steps below then only execute what this
      # step already produced.
      - name: Build the image and the chart
        run: bazel build //sortie:image_push //charts/sortie:sortie.push_registry

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-arch image
        run: bazel run //sortie:image_push

      # The digest comes from the build rather than from the registry. Resolving
      # it by listing tags would have to follow ghcr's pagination -- it returns
      # 100 tags per page, ascending, so a freshly pushed tag sorts last and is
      # never on the first page -- and re-resolving a tag reintroduces a
      # time-of-check window against a mutable one. Bazel already wrote the
      # digest it pushed.
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          # The digest is not a default output, so cquery does not list it.
          # It sits beside the index manifest, which is, and both come from the
          # same rule -- so derive one path from the other rather than assuming
          # a bazel-bin layout.
          index_file="$(bazel cquery //sortie:image_index --output=files 2>/dev/null \
            | grep -E '_index\.json$' | head -1)"
          digest_file="${index_file%_index.json}_digest"
          if [ -z "${digest_file}" ] || [ ! -s "${digest_file}" ]; then
            echo "::error::could not find the image index digest produced by the build" >&2
            exit 1
          fi
          digest="$(cat "${digest_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
          esac
          echo "image=ghcr.io/bpalermo/sortie@${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ghcr.io/bpalermo/sortie@${digest}"

          # The children too, so verification can cover what signing covered.
          # They come out of the index the build wrote, for the same reason the
          # index digest does: it is what was pushed.
          children="$(jq -r '[.manifests[].digest] | join(" ")' "${index_file}")"
          if [ -z "${children}" ]; then
            echo "::error::the index lists no child manifests" >&2
            exit 1
          fi
          echo "children=${children}" >> "${GITHUB_OUTPUT}"
          echo "child manifests: ${children}"

      # --recursive signs the index and every child manifest. Without it, anyone
      # pulling the amd64 or arm64 manifest by its own digest gets something
      # unsigned. Signing by digest rather than by tag avoids cosign
      # re-resolving a mutable tag to something other than what was pushed.
      #
      # ghcr does not implement the OCI Referrers API: it returns 404 for a
      # real digest. cosign works there anyway because it falls back to the OCI
      # 1.1 `sha256-<digest>` tag -- rehearsed on a throwaway package before
      # this was pointed at the real one: ghcr answered the referrers endpoint
      # with 404 and cosign signed and verified the index and every child
      # regardless.
      #
      # That is also why rules_img's own signing support is not used here. Its
      # `signing_config` docstring says "the signature is then pushed to the
      # image's repository as an OCI referrer", and whether it also falls back
      # to a tag is not visible -- that push is a prebuilt binary, not in the
      # archive. Without a fallback it cannot work here, which is the
      # assumption this rests on. It is an assumption, not a measurement; see
      # AGENTS.md, which separates the two.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
        run: cosign sign --recursive "${{ steps.digest.outputs.image }}"

      # Every digest that was signed, not just the index. `cosign verify` has no
      # --recursive to match `cosign sign --recursive`, so verifying the index
      # alone would pass while the per-architecture manifests went unchecked --
      # exactly the coverage --recursive exists to provide, and exactly what
      # someone pulling by an architecture-specific digest relies on.
      - name: Verify the signatures
        run: |
          set -euo pipefail
          for digest in ${{ steps.digest.outputs.children }}; do
            echo "verifying child ${digest}"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/bpalermo/sortie@${digest}" > /dev/null
          done
          echo "verifying index ${{ steps.digest.outputs.image }}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.digest.outputs.image }}" > /dev/null
          echo "index and all child manifests verified"

      # Ask the registry which layout landed, rather than asking the binary
      # that just wrote the signature whether it likes what it wrote.
      #
      # cosign 3 writes signatures to the OCI 1.1 fallback tag `sha256-<digest>`
      # rather than cosign 2's `sha256-<digest>.sig`. The two are mutually
      # exclusive per digest, so their presence says which format was produced.
      # The verify step above cannot: it auto-detects and accepts either, and
      # `--new-bundle-format=true` does not constrain it -- measured, it returns
      # 0 against a cosign 2 signature. (`=false` does gate, but only for a
      # repository holding the old layout.) So the assertion has to be here.
      - name: Assert the published signature layout
        run: |
          set -euo pipefail
          token="$(curl -fsSL -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:bpalermo/sortie:pull" | jq -r .token)"
          status() {
            curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/bpalermo/sortie/manifests/$1"
          }
          fail=0
          for digest in ${{ steps.digest.outputs.children }} ${{ steps.digest.outputs.image }}; do
            # The index arrives as a full reference; the children as bare digests.
            hex="${digest##*@}"; hex="${hex#sha256:}"
            bundle="$(status "sha256-${hex}")"
            legacy="$(status "sha256-${hex}.sig")"
            if [ "${bundle}" != "200" ] || [ "${legacy}" != "404" ]; then
              echo "::error::sha256-${hex}: expected the bundle tag present (got ${bundle}) and the .sig tag absent (got ${legacy})" >&2
              fail=1
            else
              echo "  sha256-${hex}: bundle tag present, .sig absent"
            fi
          done
          [ "${fail}" -eq 0 ] || exit 1
          echo "every signature is in the expected layout"

      # The chart carries the image's digest, pinned at package time, so this
      # publishes a chart that can only ever reference the image signed above.
      #
      # docker/login-action above is not enough: rules_helm pins
      # HELM_REGISTRY_CONFIG to a fresh temp directory for every invocation, so
      # Helm reads neither ~/.docker/config.json nor any config a prior
      # `helm registry login` wrote. Its pusher logs in itself, but only when it
      # finds both of these variables -- otherwise it skips the login without
      # failing and the push gets a 401.
      - name: Push the chart
        env:
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bazel run //charts/sortie:sortie.push_registry
