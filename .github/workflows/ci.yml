name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GHAS requires an explicit least-privilege grant; the default token permissions
# are otherwise write-heavy for every job in the workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: bazel
    runs-on: ubuntu-latest
    # Two BuildBuddy keys, both named BUILDBUDDY_API_KEY so the step below has
    # one reference: the repository secret (read + CAS write, so remote
    # execution works but nothing can write the action cache) for pull
    # requests and any other ref, and the `release` environment's secret
    # (cache write) for main only -- that environment is restricted to the main
    # branch. The `ci` environment holds nothing; it exists so this expression
    # has a name to fall back to, and secrets then resolve to the repository's.
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The registry is one setting, bazel/registry.bzl; a literal anywhere
      # else would survive a move and keep pointing at the old registry.
      - name: The registry is spelled out in one place
        run: scripts/check-registry-config.sh

      # No version is pinned here: bazelisk reads .bazelversion, so the
      # checkout is the single source of the Bazel version and CI cannot drift
      # from a local build.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Pull requests RESTORE caches but never SAVE them, so only reviewed
          # code populates a cache a later trusted build consumes. Gated on the
          # ref rather than the event, because workflow_dispatch can target any
          # branch and would otherwise write branch-scoped caches that evict
          # main's from the shared repo quota.
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Lint runs as ordinary test targets (tags = ["lint"]), so this covers
      # both. There is no separate go vet or gofmt step.
      # The engine is an Envoy build, offloaded to BuildBuddy remote execution
      # (see the rbe-buildbuddy configs in .bazelrc). A pull request from a
      # fork gets no secret and fails here rather than compiling Envoy on the
      # runner.
      - name: bazel test //...
        run: |
          bazel test //... \
            --config=rbe-buildbuddy-amd64 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }} \
            --build_metadata=ROLE=CI \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }} \
            --test_output=errors

      # Gazelle generates the BUILD files, so a hand-edited or stale one is a
      # real failure mode: the Bazel build keeps working against the old graph
      # until someone regenerates and the diff appears in an unrelated PR.
      - name: BUILD files are up to date
        run: |
          bazel run //:gazelle
          if ! git diff --exit-code -- 'BUILD.bazel' '**/BUILD.bazel'; then
            echo "::error::BUILD files are stale; run 'bazel run //:gazelle'" >&2
            exit 1
          fi

  # The chart, installed for real: a kind cluster, both images built from this
  # commit and loaded into its node, the engine on, a plan run through the Job
  # and the verdict read from it (test/chart/run.sh). The bazel job tests
  # everything the chart contains; this is the only test of the chart as a
  # thing that gets installed. After the bazel job so the engine build is a
  # cache hit rather than a second compile of Envoy.
  chart:
    name: chart (kind)
    needs: [bazel]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No version is pinned here: bazelisk reads .bazelversion, so the
      # checkout is the single source of the Bazel version and CI cannot drift
      # from a local build.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Pull requests RESTORE caches but never SAVE them, so only reviewed
          # code populates a cache a later trusted build consumes. Gated on the
          # ref rather than the event, because workflow_dispatch can target any
          # branch and would otherwise write branch-scoped caches that evict
          # main's from the shared repo quota.
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: sortie-e2e

      - name: test/chart/run.sh
        run: |
          test/chart/run.sh \
            --config=rbe-buildbuddy-amd64 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }} \
            --build_metadata=ROLE=CI \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }}

  # The engine on arm64, on main only: it doubles the Bazel time, and main is
  # where the arm64 release is built from. A native arm64 driver is required
  # (see publish.yml).
  bazel-arm64:
    name: bazel (arm64)
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: bazel test //...
        run: |
          bazel test //... \
            --config=rbe-buildbuddy-arm64 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }} \
            --build_metadata=ROLE=CI \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }} \
            --test_output=errors

  # The single check branch protection requires, and the only reason this job
  # exists.
  #
  # A required status check is matched by CHECK RUN name, so requiring the jobs
  # themselves ties branch protection to their names: rename or split one, or
  # add a matrix, and the required check can never report again -- which blocks
  # every pull request on something that will never turn green, rather than
  # failing it. Requiring one aggregate leaves the jobs free to change.
  #
  # if: always() so it runs even when a job fails -- a skipped job reports
  # nothing, and a required check that never reports blocks the pull request
  # instead of failing it.
  ci:
    name: ci
    needs: [bazel, bazel-arm64, chart]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Reads the results rather than naming the jobs, so adding a job to
      # `needs` above is enough to have it gate merges.
      - name: every job this depends on must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: ${results}"
          for result in ${results}; do
            # skipped: the arm64 job only runs on main.
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::a required job reported '${result}'" >&2
              exit 1
            fi
          done
